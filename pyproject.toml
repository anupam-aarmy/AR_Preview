[project]
name = "ar-preview"
version = "2.0.0"
description = "AI-powered product visualization MVP for realistic wall fitting using SAM segmentation and Stable Diffusion with ControlNet"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "anupam-aarmy"}
]
keywords = [
    "computer-vision",
    "ai",
    "augmented-reality",
    "product-visualization",
    "sam",
    "stable-diffusion",
    "controlnet",
    "opencv"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11"
]

[project.urls]
Homepage = "https://github.com/anupam-aarmy/AR_Preview"
Repository = "https://github.com/anupam-aarmy/AR_Preview"
"Bug Reports" = "https://github.com/anupam-aarmy/AR_Preview/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scripts"]